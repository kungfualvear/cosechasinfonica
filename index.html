<style>
:root{
  --bordo:#5B1A3A; --bordo2:#744059; --verde:#4F6B2A; --dorado:#C9A24A; --dorado-osc:#9a7a2c;
  --crema:#FFFDF0; --crema2:#F8F2DC; --texto:#3d1328; --suave:#7a6a55; --linea:#e3d9b8; --card:#ffffff;
  --c-ensayo:#5B1A3A; --c-taller:#4F6B2A; --c-seccional:#2f7f79; --c-comida:#C9A24A; --c-traslado:#7a6a55; --c-recreacion:#b4562f; --c-concierto:#8b1d52; --c-otro:#7a6a55;
}
@media (prefers-color-scheme: dark){
  :root{
    --crema:#1c1318; --crema2:#2a1c24; --texto:#f3e9e0; --suave:#b9a99a; --linea:#46313c; --card:#26191f;
    --bordo:#4a1530; --dorado:#d9b45c; --verde:#8fb05a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--crema);color:var(--texto);font-size:16px;line-height:1.35;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
header.top{
  background:var(--bordo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;
}
header.top svg{flex:none;width:44px;height:44px}
header.top .t1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:#d9d5b0;text-transform:uppercase;line-height:1.15}
header.top .t2{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:20px;color:var(--dorado);letter-spacing:.04em;line-height:1.1}
header.top .t3{font-size:12px;color:#e8d7df;margin-top:3px}
#aviso{display:none;background:var(--dorado);color:#2b1a05;padding:10px 16px;font-weight:600;font-size:14px}
#aviso.on{display:block}

.view{display:none}
.view.on{display:block}

/* barra de días */
#dayBar{
  position:sticky;top:0;z-index:20;background:var(--crema2);border-bottom:1px solid var(--linea);
  display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;
}
#dayBar::-webkit-scrollbar{display:none}
.daybtn{
  flex:1 0 auto;min-width:48px;min-height:56px;border:1.5px solid var(--linea);background:var(--card);color:var(--texto);
  border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;cursor:pointer;position:relative;
}
.daybtn span{font-size:12px;color:var(--suave);font-weight:600}
.daybtn b{font-size:20px;line-height:1.1}
.daybtn.active{background:var(--bordo);border-color:var(--bordo);color:#fff}
.daybtn.active span{color:var(--dorado)}
.daybtn.today::after{content:"";position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--dorado)}

/* controles */
.controls{padding:12px 14px 4px}
.chips{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:10px;width:100%}
.chip{
  flex:1 1 0;min-width:0;min-height:48px;padding:2px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;
  font-size:clamp(12px,3.7vw,15px);border:1.5px solid var(--bordo2);background:transparent;color:var(--texto);
  font-family:inherit;font-weight:600;cursor:pointer;
}
.chip small{display:block;font-size:.85em;font-weight:500;color:var(--suave)}
.chip.on{background:var(--bordo);color:#fff;border-color:var(--bordo)}
.chip.on small{color:var(--dorado)}
.search{
  width:100%;min-height:44px;border:1.5px solid var(--linea);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;
  background:var(--card);color:var(--texto);
}
.search::placeholder{color:var(--suave)}

/* encabezado de día */
.dayhead{padding:10px 16px 2px}
.dayhead h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:24px;color:var(--bordo)}
@media (prefers-color-scheme: dark){.dayhead h2{color:var(--dorado)}}
.dayhead p{margin:0;color:var(--suave);font-size:14px}
.daylabel{padding:16px 16px 2px;font-weight:700;color:var(--dorado-osc);text-transform:uppercase;font-size:13px;letter-spacing:.06em}

/* eventos */
#list{padding:8px 12px 12px;touch-action:pan-y}
.ev{
  display:flex;gap:12px;background:var(--card);border:1px solid var(--linea);border-left:6px solid var(--c-otro);
  border-radius:12px;padding:12px;margin:10px 0;position:relative;
}
.ev.t-ensayo{border-left-color:var(--c-ensayo)}
.ev.t-taller{border-left-color:var(--c-taller)}
.ev.t-seccional{border-left-color:var(--c-seccional)}
.ev.t-comida{border-left-color:var(--c-comida)}
.ev.t-traslado{border-left-color:var(--c-traslado)}
.ev.t-recreacion{border-left-color:var(--c-recreacion)}
.ev.t-concierto{border-left-color:var(--c-concierto);background:linear-gradient(180deg,var(--card),var(--crema2));box-shadow:0 0 0 1.5px var(--dorado)}
.ev .time{flex:0 0 86px;font-weight:800;font-size:18px;line-height:1.15;color:var(--bordo)}
@media (prefers-color-scheme: dark){.ev .time{color:var(--dorado)}}
.ev .time small{display:block;font-weight:600;font-size:12px;color:var(--suave);margin-top:2px}
.ev .body{flex:1;min-width:0}
.ev h3{margin:0 0 3px;font-size:16px;line-height:1.25}
.ev .place{font-weight:700;font-size:13px;color:var(--bordo2);text-transform:uppercase;letter-spacing:.02em}
@media (prefers-color-scheme: dark){.ev .place{color:#d8a9c1}}
.ev .note{margin-top:4px;font-size:14px;color:var(--texto)}
.ev .more{margin-top:6px;font-size:13px;color:var(--verde);font-weight:700}
.ev .det{display:none;margin-top:8px;border-top:1px dashed var(--linea);padding-top:8px}
.ev.open .det{display:block}
.ev.open .more::after{content:" ▴"}
.ev:not(.open) .more::after{content:" ▾"}
.det .gp{font-weight:700;font-size:13px;color:var(--bordo2);margin-top:6px;text-transform:uppercase}
@media (prefers-color-scheme: dark){.det .gp{color:#d8a9c1}}
.det ul{margin:3px 0 0;padding-left:18px}
.det li{margin:2px 0;font-size:15px}
.badge{
  position:absolute;top:-9px;right:10px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:10px;
}
.badge.now{background:#c2183f;color:#fff}
.badge.next{background:var(--dorado);color:#2b1a05}
.ev.done{opacity:.55}
.ev.now{box-shadow:0 0 0 2px #c2183f}
.only{margin-top:4px;font-size:12px;font-weight:700;color:var(--dorado-osc)}
.mealnote{margin:2px 14px 8px;padding:8px 12px;border-radius:10px;background:var(--crema2);border:1px solid var(--linea);font-size:13px;color:var(--texto)}
.empty{text-align:center;color:var(--suave);padding:30px 16px}

/* lugares / docentes */
.card{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:14px;margin:10px 12px}
.card h3{margin:0 0 4px;font-size:16px;color:var(--bordo)}
@media (prefers-color-scheme: dark){.card h3{color:var(--dorado)}}
.card p{margin:0;font-size:15px}
.card .dim{color:var(--suave);font-style:italic}
.card .who{font-weight:700}
.card .what{color:var(--suave);font-size:14px}
.sect{padding:14px 16px 0;font-family:Georgia,"Times New Roman",serif;font-size:22px;color:var(--bordo)}
@media (prefers-color-scheme: dark){.sect{color:var(--dorado)}}

/* navegación inferior */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bordo);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button{
  flex:1;min-height:60px;border:0;background:transparent;color:#d8c4cd;font-family:inherit;font-size:12px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
}
nav.bottom button .ic{font-size:22px;line-height:1}
nav.bottom button.on{color:var(--dorado)}

footer.pie{padding:18px 16px 4px;text-align:center;color:var(--suave);font-size:12px}

@media (min-width:700px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--linea);border-right:1px solid var(--linea)}
  nav.bottom{max-width:560px;left:50%;transform:translateX(-50%)}
}
@media print{
  nav.bottom,#dayBar,.controls{display:none}
  .view{display:block!important}
  .ev .det{display:block!important}
}
</style>
</head>

];

var ORQUESTAS = [
 {k:"malbec",     n:"Orquesta Malbec",     r:"Infantil"},
 {k:"chardonnay", n:"Orquesta Chardonnay", r:"Juvenil"}
];

/* ============ UTILIDADES ============ */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function mins(t){
  var m = /^(\d{1,2}):(\d{2})/.exec(t); if(!m) return 0;
  var h = +m[1], mi = +m[2], v = h*60+mi;
  if(h < 4) v += 1440;               // 00:00 pertenece a la madrugada del día siguiente
  return v;
}
function fmtHora(t){ return /^\d{1,2}:\d{2}$/.test(t) ? t+" hs" : t.replace(/(\d{2})$/, "$1")+" hs"; }
var ICON = {ensayo:"🎻",taller:"🎼",seccional:"👥",comida:"🍽️",traslado:"🚌",recreacion:"🎉",concierto:"🎶",otro:"📍"};
var TIPO = {ensayo:"Ensayo",taller:"Taller",seccional:"Seccional",comida:"Comida",traslado:"Traslado",recreacion:"Recreación",concierto:"Concierto",otro:""};

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;} }

/* ============ ESTADO ============ */
var state = {view:"agenda", day:0, orq:"todas", q:""};
var savedOrq = store("cs_orq");
if(savedOrq==="malbec"||savedOrq==="chardonnay"||savedOrq==="todas") state.orq = savedOrq;

function hoyInfo(){
  var d = new Date();
  var inRange = (d.getFullYear()===2026 && d.getMonth()===9 && d.getDate()>=5 && d.getDate()<=11);
  return {inRange:inRange, idx: inRange ? d.getDate()-5 : -1, min: d.getHours()*60+d.getMinutes(), before: d < new Date(2026,9,5), after: d >= new Date(2026,9,12)};
}
(function initDay(){
  var h = hoyInfo();
  if(h.inRange) state.day = h.idx; else if(h.after) state.day = 6; else state.day = 0;
})();

/* ============ RENDER ============ */
var LOGISTICA = /^(Traslado|Desayuno|Almuerzo|Merienda|Cena|Recreación|Fogón)|merienda/i;
function visible(e){
  if(state.orq==="todas") return true;
  if(!e.tags) return state.orq==="chardonnay" && LOGISTICA.test(e.title);
  return e.tags.indexOf(state.orq) !== -1;
}
function haystack(e){
  var t = [e.title, e.place, e.note, TIPO[e.type]];
  if(/^(Desayuno|Almuerzo|Cena)$/.test(e.title)) t.push("otras provincias");
  if(e.groups) e.groups.forEach(function(g){ t.push(g.p); t = t.concat(g.i); });
  return t.join(" ").toLowerCase();
}
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function statuses(dayIdx){
  var h = hoyInfo(), out = {};
  if(!h.inRange || h.idx!==dayIdx) return out;
  var evs = DAYS[dayIdx].events;
  var order = evs.map(function(e,i){return {i:i, s:mins(e.s), v:visible(e)};}).filter(function(o){return o.v;}).sort(function(a,b){return a.s-b.s;});
  var nextFound = false;
  order.forEach(function(o,k){
    var e = evs[o.i], start = o.s, end;
    if(e.e) end = mins(e.e);
    else {
      end = start + 60;
      for(var j=k+1;j<order.length;j++){ if(order[j].s>start){ end = order[j].s; break; } }
    }
    if(h.min >= end) out[o.i] = "done";
    else if(h.min >= start) out[o.i] = "now";
    else if(!nextFound){ out[o.i] = "next"; nextFound = true; }
  });
  return out;
}

function cardHTML(e, st){
  var h = fmtHora(e.s), time;
  if(e.e) time = e.s.replace(/^0(\d)/,"$1") + '<small>a ' + e.e + ' hs</small>';
  else time = h.replace(" hs","") + '<small>hs</small>';
  var badge = st==="now" ? '<span class="badge now">AHORA</span>' : (st==="next" ? '<span class="badge next">SIGUIENTE</span>' : "");
  var det = "";
  if(e.groups){
    det = '<div class="det">' + e.groups.map(function(g){
      return (g.p ? '<div class="gp">'+esc(g.p)+'</div>' : '') + '<ul>' + g.i.map(function(x){return '<li>'+esc(x)+'</li>';}).join("") + '</ul>';
    }).join("") + '</div>';
  }
  return '<article class="ev t-'+e.type+' '+(st||"")+'" '+(e.groups?'data-toggle="1"':'')+'>' + badge +
    '<div class="time">'+time+'</div>' +
    '<div class="body"><h3>'+ICON[e.type]+' '+esc(e.title)+'</h3>' +
    (e.place ? '<div class="place">'+esc(e.place)+'</div>' : '') +
    (e.note ? '<div class="note">'+esc(e.note)+'</div>' : '') +
    (/^(Desayuno|Almuerzo|Cena)$/.test(e.title) ? '<div class="only">Solo participantes de otras provincias</div>' : '') +
    (e.groups ? '<div class="more">Ver docentes y salas</div>' + det : '') +
    '</div></article>';
}

function renderDayBar(){
  var h = hoyInfo();
  var html = DAYS.map(function(d,i){
    return '<button class="daybtn'+(i===state.day?' active':'')+(h.inRange&&h.idx===i?' today':'')+'" data-day="'+i+'" aria-label="'+d.name+' de octubre"><span>'+d.short+'</span><b>'+d.num+'</b></button>';
  }).join("");
  var bar = document.getElementById("dayBar");
  bar.innerHTML = html;
  var a = bar.querySelector(".active");
  if(a && a.scrollIntoView){ try{ a.scrollIntoView({inline:"center",block:"nearest"}); }catch(e){} }
}

function renderChips(){
  var c = document.getElementById("chips");
  c.innerHTML =
    '<button class="chip'+(state.orq==="todas"?' on':'')+'" data-orq="todas">Todas</button>' +
    ORQUESTAS.map(function(o){
      return '<button class="chip'+(state.orq===o.k?' on':'')+'" data-orq="'+o.k+'">'+o.n.replace("Orquesta ","")+' <small>'+o.r.toLowerCase()+'</small></button>';
    }).join("");
}

function renderList(){
  var list = document.getElementById("list"), head = document.getElementById("head");
  var q = norm(state.q.trim());
  var html = "";
  if(q){
    head.innerHTML = '<div class="dayhead"><h2>Resultados</h2><p>Búsqueda en toda la semana</p></div>';
    DAYS.forEach(function(d){
      var m = d.events.filter(function(e){ return visible(e) && norm(haystack(e)).indexOf(q)!==-1; });
      if(m.length){
        html += '<div class="daylabel">'+d.name+' de octubre</div>' + m.map(function(e){return cardHTML(e,"");}).join("");
      }
    });
    if(!html) html = '<div class="empty">No se encontraron actividades.</div>';
  } else {
    var d = DAYS[state.day];
    head.innerHTML = '<div class="dayhead"><h2>'+d.name+'</h2><p>de octubre'+(state.orq!=="todas"?' · Orquesta '+(state.orq==="malbec"?"Malbec":"Chardonnay"):'')+'</p></div>';
    var st = statuses(state.day);
    var shown = d.events.map(function(e,i){return {e:e,i:i};}).filter(function(o){return visible(o.e);});
    html = shown.map(function(o){ return cardHTML(o.e, st[o.i]); }).join("");
    if(!html) html = '<div class="empty">Sin actividades</div>';
  }
  list.innerHTML = html;
}

function renderStatic(){
  document.getElementById("lugares").innerHTML = LUGARES.map(function(l){
    return '<div class="card"><h3>'+esc(l.n)+'</h3>' + (l.d ? '<p>'+esc(l.d)+'</p>' : '<p class="dim">Dirección no informada en el cronograma.</p>') + '</div>';
  }).join("");
  document.getElementById("docentes").innerHTML = DOCENTES.map(function(d){
    return '<div class="card"><p class="who">'+esc(d.n)+'</p><p class="what">'+esc(d.r)+'</p></div>';
  }).join("");
  document.getElementById("orquestas").innerHTML = ORQUESTAS.map(function(o){
    return '<div class="card"><p class="who">'+esc(o.n)+'</p><p class="what">'+esc(o.r)+'</p></div>';
  }).join("");
}

function setView(v){
  state.view = v;
  ["agenda","lugares","docentes"].forEach(function(k){
    document.getElementById("v-"+k).classList.toggle("on", k===v);
  });
  Array.prototype.forEach.call(document.querySelectorAll("nav.bottom button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-view")===v);
  });
  window.scrollTo(0,0);
}

function setDay(i){
  if(i<0||i>6) return;
  state.day = i; state.q = ""; document.getElementById("q").value = "";
  renderDayBar(); renderList();
}

/* ============ EVENTOS ============ */
document.getElementById("dayBar").addEventListener("click", function(e){
  var b = e.target.closest(".daybtn"); if(!b) return;
  setDay(+b.getAttribute("data-day")); window.scrollTo(0,0);
});
document.getElementById("chips").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if(!b) return;
  state.orq = b.getAttribute("data-orq"); store("cs_orq", state.orq);
  renderChips(); renderList();
});
document.getElementById("q").addEventListener("input", function(e){
  state.q = e.target.value; renderList();
});
document.getElementById("list").addEventListener("click", function(e){
  var a = e.target.closest(".ev[data-toggle]"); if(a) a.classList.toggle("open");
});
Array.prototype.forEach.call(document.querySelectorAll("nav.bottom button"), function(b){
  b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); });
});

/* deslizar para cambiar de día */
(function(){
  var x0=0,y0=0,t0=0, el=document.getElementById("list");
  el.addEventListener("touchstart", function(e){ var t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
  el.addEventListener("touchend", function(e){
    if(state.q.trim()) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>70 && Math.abs(dy)<45 && Date.now()-t0<600){
      setDay(state.day + (dx<0?1:-1)); window.scrollTo(0,0);
    }
  }, {passive:true});
})();

/* ============ INICIO ============ */
if(AVISO){ var av=document.getElementById("aviso"); av.textContent=AVISO; av.classList.add("on"); }
renderStatic(); renderChips(); renderDayBar(); renderList();
setInterval(function(){ if(!state.q.trim()) renderList(); }, 60000);

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
